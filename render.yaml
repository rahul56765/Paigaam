# Render.com blueprint — https://render.com/docs/blueprint-spec
# With this file committed, Render can auto-provision the service via "New > Blueprint".
services:
  - type: web
    name: paigaam
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        value: admin@paigaam.cc
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAIGAAM_WHATSAPP
        sync: false
      - key: BASE_URL
        value: https://paigaam.cc
    disk:
      name: paigaam-data
      mountPath: /var/data
      sizeGB: 1
