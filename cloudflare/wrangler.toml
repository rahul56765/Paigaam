name = "paigaam-fresh-preview"
main = "src/worker.mjs"
compatibility_date = "2026-11-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[vars]
DRAFTS_ENABLED = "false"
CHECKOUT_ENABLED = "false"
ALLOW_LIVE_PAYMENTS = "false"

